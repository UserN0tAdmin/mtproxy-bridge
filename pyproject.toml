[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtproxy-bridge"
version = "0.3.1"
description = "MTProto proxy SOCKS5 bridge for Kurigram and similar clients: classic MTProxy (FakeTLS/obfuscated2) and WEB Proxy (tg://webproxy) links"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.9"
authors = [
    { name = "UserN0tAdmin" }
]
keywords = ["mtproto", "telegram", "proxy", "socks5", "kurigram", "faketls", "mtproxy", "webproxy", "network", "mtproto-proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "cryptography>=43.0",
]

[project.optional-dependencies]
web = ["aiohttp>=3.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/UserN0tAdmin/mtproxy-bridge"
Repository = "https://github.com/UserN0tAdmin/mtproxy-bridge"
Issues = "https://github.com/UserN0tAdmin/mtproxy-bridge/issues"

[project.scripts]
mtproxy-bridge = "mtproxy_bridge.cli:main"

[tool.hatch.build.targets.wheel]
include = ["mtproxy_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
